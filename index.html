<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div id="loader" class="loader-container d-none">
        <span class="loader"></span>
    </div>

    <section class="py-4">
        <div class="container">

            <h1 class="text-center mb-4">Recipe Search</h1>

            <div class="input-group mb-3 w-50 mx-auto">

                <input id="searchinput" type="search" class="form-control" placeholder="Search"
                    aria-label="Recipient's username" aria-describedby="basic-addon2">

                <button id="searchBtn" class="btn btn-primary" type="button">

                    Search

                </button>

            </div>

            <div id="alertMsg" class="alert alert-danger d-none" role="alert"></div>


            <div id="rowdata" class="row g-4">


            </div>

        </div>

        <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">

            <div class="modal-dialog">

                <div class="modal-content">

                    <div class="modal-header">

                        <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>

                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>

                    </div>

                    <div class="modal-body">

                        ...

                    </div>

                    <div class="modal-footer">

                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>

                    </div>

                </div>

            </div>

        </div>


    </section>





    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./javascript/main.js"></script>
</body>

</html>
